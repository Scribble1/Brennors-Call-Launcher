name: Windows launcher
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test updater, accounts, process isolation and secure IPC; compile WPF and publisher
        shell: pwsh
        run: ./Tools/Test-Launcher.ps1
      - name: Create isolated CI publisher configuration
        shell: pwsh
        run: |
          New-Item -ItemType Directory .local/ci -Force | Out-Null
          dotnet run --project Launcher/ReleaseTool -c Release -- keygen .local/ci/ci.private.pem .local/ci/ci.public.pem
          if ($LASTEXITCODE -ne 0) { throw 'Key generation failed' }
          dotnet run --project Launcher/ReleaseTool -c Release -- config .local/ci/deployment.json .local/ci/ci.public.pem ci-only http://127.0.0.1:5095 http://127.0.0.1:5080 127.0.0.1:7777 live
          if ($LASTEXITCODE -ne 0) { throw 'Config generation failed' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build self-contained launcher and test installer packaging
        shell: pwsh
        run: ./Tools/Build-Launcher.ps1 -Installer -DeploymentConfig .local/ci/deployment.json
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-CI-loopback-only
          path: Artifacts/Launcher/0.2.0/installer/*.exe
          if-no-files-found: error
          retention-days: 7
